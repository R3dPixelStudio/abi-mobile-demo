name: Publish approved demo
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-demo
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.DEMO_SITE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check required configuration
        run: test -n "$NEXT_PUBLIC_SITE_URL" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:cloudflare
      - run: npm run deploy
      - name: Verify public routes and assets
        run: TEST_BASE_URL="$NEXT_PUBLIC_SITE_URL" npm run test:smoke
